services:
  - type: web
    name: guide-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m unittest tests.test_regressions && python -m playwright install-deps chromium && PLAYWRIGHT_BROWSERS_PATH="$PWD/.playwright" python -m playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GUIDE_DB_PATH
        value: /var/data/guide.db
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: VAULT_SECRET_KEY
        generateValue: true
      - key: GUIDE_PUBLIC_URL
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      - key: KERNEL_API_KEY
        sync: false
    disk:
      name: guide-data
      mountPath: /var/data
      sizeGB: 1
