services:
  - type: web
    name: guide-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GUIDE_DB_PATH
        value: /var/data/guide.db
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: BRAVE_API_KEY
        sync: false
      - key: VAULT_SECRET_KEY
        generateValue: true
      - key: GUIDE_PUBLIC_URL
        sync: false
    disk:
      name: guide-data
      mountPath: /var/data
      sizeGB: 1
